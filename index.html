<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Garden</title>
  <link rel="stylesheet" href="style.css">
</head>




<body>






<h1 id="garden-title">My Little Garden</h1>
<hr width="90%" size="4" color="black" >
<br>


<div id="game-container">


    <div id="Buttons">
    <!--Carrot button-->
        <button style="font-size: 25px; border-radius:40px;" id="carrot-button"class:button>
            <img style="height:100px;" src="../images/carrot.png" alt="Carrots">
        </button>
    <!--Berry button-->
        <button style="font-size: 25px; border-radius:40px;" id="berry-button">
            <img style="height:100px;" src="../images/berries.png" alt="Berries">
        </button>
    <!--Watermelon button-->
        <button style="font-size: 25px; border-radius:40px;" id="watermelon-button">
            <img style="height:100px;" src="../images/melon.png" alt="Melons">
        </button>
    <!--Hoe button-->
        <button style="font-size: 25px; border-radius:40px;" id="diamond-hoe-button">
            <img style="height:100px;" src="../images/diamond hoe.png" alt="Diamond hoe">
        </button>
    <!--Water button-->
        <button style="font-size: 25px; border-radius:40px;" id="water-button">
            <img style="height:100px;" src="../images/water.png" alt="Water">
        </button>
    </div>


</div>
